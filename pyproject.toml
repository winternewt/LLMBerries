[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmberries"
version = "0.1.0"
description = "An ethical experiment with LLM agents competing for resources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.9.0",
    "cerebras-cloud-sdk>=1.91.0",
    "frozendict>=2.4.6",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "just-agents>=0.8.7",
    "litellm>=1.78.5",
    "openai>=2.54.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.1",
    "win-unicode-console>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "objects"]
